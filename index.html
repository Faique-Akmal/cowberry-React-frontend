<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/lantern-logo-full.png" /> -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/lantern-logo-full.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantern360</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("isDarkMode");
          var theme = localStorage.getItem("theme");
          var isDark = false;
          if (saved !== null) {
            isDark = JSON.parse(saved);
          } else if (theme !== null) {
            isDark = theme === "dark";
          }
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
